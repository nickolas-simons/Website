<!DOCTYPE html>
<html>

  {% include head.html %}

  <body>

    {% assign bg_placeholder = site.data.bg_placeholders[page.background] %}
    <main class="wrapper"{% if page.background %} style="--page-bg: url('{{ page.background | prepend: site.baseurl }}');{% if bg_placeholder %} --page-bg-placeholder: url('{{ bg_placeholder }}');{% endif %}"{% endif %}>

      <div class="container">
        {% include header.html %}

        {% unless page.directory %}
          {% include info.html %}
        {% endunless %}

        {{ content }}

        {% include footer-home.html %}
      </div>

    </main>

    {% include scripts.html %}

  </body>

</html>
